# Max-performance demo: a strong interceptor with unlimited divert, easier
# threats aimed at the origin, and a launch as soon as the track is confirmed.
title: "THAAD v5.0 | MAX-PERFORMANCE INTERCEPT DEMO"
mode: "MAX-PERFORMANCE MODE"

sim:
  dt: 0.02            # s
  integrator: rk4     # rk4 (4th order) or euler (forward Euler, 1st order)
  t_max: 150.0        # s, base window; extended to 2 x T_imp + 30 s per scenario
  g: 9.81             # m/s^2

sensor:
  pos_noise: 25.0     # m, 1-sigma per axis
  vel_noise: 8.0      # m/s, 1-sigma per axis

kalman:
  q: 30.0             # m^2/s^3, white-noise acceleration spectral density per axis

threat:
  drag: 0.00004       # 1/m, quadratic drag (acceleration per speed^2)

interceptor:
  boost_thrust: 220000.0  # N
  isp: 400.0              # s, specific impulse; burn time = (wet - dry) * isp * g0 / thrust = 8.0 s
  mass_wet: 900.0         # kg
  mass_dry: 450.0         # kg
  kv_mass: 200.0          # kg
  kv_drag: 0.00008
  booster_drag: 0.0001
  pn_gain: 4.0
  max_g: 50.0             # g, lateral limit
  kv_divert_dv: null      # unlimited divert

engagement:
  launch_rule: fire_on_track  # engage every descending threat
  min_track_time: 3.0         # s of tracking before a launch is allowed
  defended_radius: 30000.0    # m, drawn in the replay only
  kill_radius: 30.0           # m

scenario:
  impact_time: [80.0, 110.0]     # s, nominal time to impact
  altitude: [40000.0, 60000.0]   # m
  range: [25000.0, 40000.0]      # m, initial ground range
  aim_radius: null               # always aimed at the origin
  drag_comp: 1.03                # launch-velocity boost for drag
