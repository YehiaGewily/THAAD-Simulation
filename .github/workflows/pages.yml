name: Pages

# Publishes a sample replay and the batch dashboard to GitHub Pages, so the
# project can be tried without installing anything. Needs Settings > Pages >
# Source set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Build the viewer and dashboard templates
        working-directory: viewer
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Generate the site
        run: |
          mkdir -p site
          python -m thaad_sim --config configs/engineering.yaml --seed 913 --no-browser --out site/replay.html
          python -m thaad_sim.dashboard results/engineering.csv --out site/dashboard.html
          cp docs/site/index.html site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
