[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thaad-sim"
version = "0.1.0"
description = "Educational THAAD-style terminal intercept simulation with a 3D browser replay"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "rich",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
plot = ["matplotlib"]   # scripts/*.py figures

[tool.setuptools]
packages = ["thaad_sim"]

[tool.setuptools.package-data]
thaad_sim = ["viewer/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
